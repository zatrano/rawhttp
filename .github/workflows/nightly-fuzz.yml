name: Nightly fuzz

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-long:
    name: fuzz-long
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Long fuzz corpus
        working-directory: test
        run: |
          go test -timeout 15m -run=^$ -fuzz=FuzzServeConn -fuzztime=60s
          go test -timeout 10m -run=^$ -fuzz=FuzzRequestLine -fuzztime=30s
          go test -timeout 10m -run=^$ -fuzz=FuzzHeaders -fuzztime=30s
          go test -timeout 10m -run=^$ -fuzz=FuzzChunkedBody -fuzztime=30s
          go test -timeout 10m -run=^$ -fuzz=FuzzDifferentialReadRequest -fuzztime=45s
          go test -timeout 10m -run=^$ -fuzz=FuzzDifferentialNetHTTP -fuzztime=45s
