name: Performance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: ServeConn gates + allocs
        working-directory: test
        run: go test -run '^(TestGate_|TestAllocs_)' -count=1 -timeout 8m -v
      - name: Multi-rival TCP strict
        working-directory: scripts/multibench
        run: go run . -c 64 -d 3s -rounds 3 -strict -scenarios plaintext,json
        timeout-minutes: 25
