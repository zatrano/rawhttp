name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Unit + security corpus
        working-directory: test
        run: |
          go test -count=1 -timeout 5m -skip '^(TestGate_|TestAllocs_)' ./...
          go test -count=1 -timeout 3m -run '^TestSecurity' -v

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Race (default build)
        working-directory: test
        run: go test -race -count=1 -timeout 10m -skip '^(TestGate_|TestAllocs_)' ./...
      - name: Race (rawhttp_poison)
        working-directory: test
        run: go test -race -tags rawhttp_poison -count=1 -timeout 10m -skip '^(TestGate_|TestAllocs_)' ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Coverage >= 70%
        working-directory: test
        run: |
          go test -count=1 -timeout 5m -skip '^(TestGate_|TestAllocs_)' \
            -covermode=atomic -coverpkg=github.com/zatrano/rawhttp \
            -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "coverage=${pct}%"
          awk -v p="$pct" 'BEGIN { if ((p+0) < 70.0) exit 1 }'

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go build ./...
      - run: |
          go mod tidy
          (cd test && go mod tidy)
          git diff --exit-code -- go.mod test/go.mod
          if [ -f test/go.sum ]; then git diff --exit-code -- test/go.sum; fi

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - working-directory: test
        run: |
          go test -timeout 5m -run=^$ -fuzz=FuzzServeConn -fuzztime=15s
          go test -timeout 3m -run=^$ -fuzz=FuzzRequestLine -fuzztime=8s
          go test -timeout 3m -run=^$ -fuzz=FuzzHeaders -fuzztime=8s
          go test -timeout 3m -run=^$ -fuzz=FuzzChunkedBody -fuzztime=8s
          go test -timeout 3m -run=^$ -fuzz=FuzzDifferentialReadRequest -fuzztime=8s
